model_list:
  - model_name: gpt-5.5
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: gpt-5.5-fallback
    litellm_params:
      model: openrouter/openai/gpt-5.5
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  fallbacks:
    - gpt-5.5: ["gpt-5.5-fallback"]

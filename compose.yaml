name: lumi-services

services:
  postgres:
    image: docker.io/pgvector/pgvector:0.7.4-pg16@sha256:85b8346639c4e55b763801babac0ad3cbb93043b9f38cb777a6a3379f562a865
    environment:
      POSTGRES_DB: lumi
      POSTGRES_USER: lumi_migrator
      POSTGRES_PASSWORD: "${MIGRATOR_DB_PASSWORD:?Set MIGRATOR_DB_PASSWORD in .env}"
      LUMI_AUTH_DB_PASSWORD: "${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}"
      LUMI_API_DB_PASSWORD: "${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}"
      LUMI_WORKER_DB_PASSWORD: "${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}"
    ports:
      - "127.0.0.1:6432:5432"
    volumes:
      - lumi-db-data:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumi_migrator -d lumi && psql -U lumi_migrator -d lumi -tAc \"select extversion from pg_extension where extname='vector'\" | grep -qx 0.7.4"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  searxng:
    image: docker.io/searxng/searxng:2026.8.22-9fea41204@sha256:11a9b34cdc0b1ec2b991470a2762ecb5a1a531898289fb51dcd015260450729e
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cp /usr/local/searxng/lumi-settings.yml /etc/searxng/settings.yml
        printf '  secret_key: "%s"\n' "$$(head -c 24 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9')" >> /etc/searxng/settings.yml
        exec /usr/local/searxng/entrypoint.sh
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./services/searxng/settings.yml:/usr/local/searxng/lumi-settings.yml:ro
      - searxng-cache:/var/cache/searxng
    tmpfs:
      - /etc/searxng
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  crawl4ai:
    image: docker.io/unclecode/crawl4ai:0.7.4@sha256:20eb241a638ad99809a6fc10651c7cc26ce9470a86568bb11147e8aaa6bb5c6b
    ports:
      - "127.0.0.1:11235:11235"
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:11235/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  litellm:
    image: ghcr.io/berriai/litellm:main-stable@sha256:468c25f35f3e5ec4e414974f00deab93337b1b4d9953cabcfd3722e59415f834
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_API_KEY:?Set LITELLM_API_KEY in .env to a strong local value}"
      DATABASE_URL: "postgresql://${LITELLM_DB_USER:?}:${LITELLM_DB_PASSWORD:?}@litellm-db:5432/litellm"
      UI_USERNAME: "${UI_USERNAME:-admin}"
      UI_PASSWORD: "${UI_PASSWORD:-admin}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}"
      GROQ_API_KEY: "${GROQ_API_KEY:?Set GROQ_API_KEY in .env}"
      CODEX_API_BASE_URL: "${CODEX_API_BASE_URL:-http://host.docker.internal:18080}"
      CODEX_API_KEY: "${CODEX_API_KEY:-no-key-required}"
      MOONSHOT_API_KEY: "${MOONSHOT_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./services/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  litellm-db:
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: "${LITELLM_DB_USER:?Set LITELLM_DB_USER in .env}"
      POSTGRES_PASSWORD: "${LITELLM_DB_PASSWORD:?Set LITELLM_DB_PASSWORD in .env}"
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_DB_USER} -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-lumi_minio_admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - lumi-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mc:
    image: docker.io/minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set lumi http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing lumi/lumi-assets
        mc anonymous set private lumi/lumi-assets
        echo 'MinIO bucket setup complete'
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-lumi_minio_admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.3@sha256:8de25e75ce39617f17f2f6c77d60a4f75b65e779ed5005420eb1400072a15c1c
    command: ["--model-id", "BAAI/bge-small-en-v1.5"]
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - tei-model-cache:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  web:
    build:
      context: .
      target: web
    environment:
      INTERNAL_API_BASE_URL: "http://api:3001"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}"
      BETTER_AUTH_TRUSTED_ORIGINS: "${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}"
      AUTH_DATABASE_URL: "postgresql://lumi_auth:${AUTH_DB_PASSWORD}@postgres:5432/lumi"
      AUTH_REQUIRE_EMAIL_VERIFICATION: "${AUTH_REQUIRE_EMAIL_VERIFICATION:-true}"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: "postgresql://lumi_api:${API_DB_PASSWORD}@postgres:5432/lumi"
      AUTH_DATABASE_URL: "postgresql://lumi_auth:${AUTH_DB_PASSWORD}@postgres:5432/lumi"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}"
      AUTH_REQUIRE_EMAIL_VERIFICATION: "${AUTH_REQUIRE_EMAIL_VERIFICATION:-true}"
      LITELLM_BASE_URL: "http://litellm:4000"
      LITELLM_API_KEY: "${LITELLM_API_KEY:?Set LITELLM_API_KEY in .env}"
      LITELLM_MODEL: "${LITELLM_MODEL:-groq-gpt-5.5}"
      SEARXNG_BASE_URL: "http://searxng:8080"
      CRAWL4AI_BASE_URL: "http://crawl4ai:11235"
      TEI_BASE_URL: "http://tei:80"
      TEI_MODEL_ID: "BAAI/bge-small-en-v1.5"
      TEI_EMBEDDING_DIMENSION: "384"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_BUCKET: "lumi-assets"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-lumi_reader_key}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}"
      MINIO_ASSET_MAX_BYTES: "${MINIO_ASSET_MAX_BYTES:-5242880}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}"
      BETTER_AUTH_TRUSTED_ORIGINS: "${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: .
      target: worker
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      WORKER_DATABASE_URL: "postgresql://lumi_worker:${WORKER_DB_PASSWORD}@postgres:5432/lumi"
      LITELLM_BASE_URL: "http://litellm:4000"
      LITELLM_API_KEY: "${LITELLM_API_KEY:?Set LITELLM_API_KEY in .env}"
      LITELLM_MODEL: "${LITELLM_MODEL:-groq-gpt-5.5}"
      SEARXNG_BASE_URL: "http://searxng:8080"
      CRAWL4AI_BASE_URL: "http://crawl4ai:11235"
      TEI_BASE_URL: "http://tei:80"
      TEI_MODEL_ID: "BAAI/bge-small-en-v1.5"
      TEI_EMBEDDING_DIMENSION: "384"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_BUCKET: "lumi-assets"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-lumi_worker_key}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}"
      MINIO_READER_ACCESS_KEY: "${MINIO_READER_ACCESS_KEY:-lumi_reader_key}"
      MINIO_READER_SECRET_KEY: "${MINIO_READER_SECRET_KEY:?Set MINIO_READER_SECRET_KEY in .env}"
      MINIO_ASSET_MAX_BYTES: "${MINIO_ASSET_MAX_BYTES:-5242880}"
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
      minio:
        condition: service_healthy
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
      tei:
        condition: service_healthy

volumes:
  lumi-db-data:
  litellm-db-data:
  lumi-minio-data:
  searxng-cache:
  tei-model-cache:
